name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check player-facing contract, tutorial, and patch notes
        env:
          TIDEWEFT_SYNC_EVENT: ${{ github.event_name }}
          TIDEWEFT_SYNC_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          TIDEWEFT_SYNC_HEAD: ${{ github.sha }}
        run: npm run check:player-facing-sync

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Build web target
        run: npm run build:web

      - name: Smoke-test Pages artifact
        run: npm run smoke:web
